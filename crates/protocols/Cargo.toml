[package]
name = "silica-protocols"
description = "XML and bindings of the silica-* protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
server = ["dep:wayland-server", "wayland-protocols/server"]
client = ["dep:wayland-client", "wayland-protocols/client"]

[dependencies]
bitflags = "2"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-protocols = "0.32"

[lints]
workspace = true
